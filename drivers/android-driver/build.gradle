plugins {
  alias(libs.plugins.android.library)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.publish)
  alias(libs.plugins.dokka)
  id("app.cash.sqldelight.toolchain.runtime")
  //alias(libs.plugins.binaryCompatibilityValidator)
}

archivesBaseName = 'sqldelight-android-driver'

android {
  compileSdk libs.versions.compileSdk.get() as int
  namespace = "app.cash.sqldelight.driver.android"

  lint {
    textReport true
    textOutput file("$reportsDir/lint-results.txt")
  }

  defaultConfig {
    minSdk libs.versions.minSdk.get() as int
  }

  buildFeatures {
    buildConfig = false
  }

  testOptions  {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  api projects.runtime
  api libs.androidx.sqlite

  implementation libs.androidx.sqliteFramework

  /*testImplementation projects.drivers.driverTest
  testImplementation libs.junit
  testImplementation libs.androidx.test.core
  testImplementation libs.robolectric*/
}

apply from: "$rootDir/gradle/gradle-mvn-push.gradle"
afterEvaluate {
  publishing {
    publications {
      release(MavenPublication) {
        from components.release
        groupId = rootProject.gradle.properties.get("GROUP")
        artifactId = "android-driver"
        version = rootProject.gradle.properties.get("VERSION_NAME")
      }
    }
  }
}


